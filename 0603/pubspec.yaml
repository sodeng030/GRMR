name: goornot
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  kakao_flutter_sdk_user: ^1.9.1
  flutter_naver_map: ^1.4.4
  geolocator: ^14.0.2
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  socket_io_client: ^2.0.3
  shared_preferences: ^2.2.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  fonts:
    - family: Paperlogy
      fonts:
        - asset: assets/fonts/Paperlogy-4Regular.ttf
        - asset: assets/fonts/Paperlogy-7Bold.ttf
          weight: 700
    - family: RiaSans
      fonts:
        - asset: assets/fonts/RiaSans-Bold.ttf

  assets:
    - assets/images/